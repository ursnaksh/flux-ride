server.port=8080

# Run backend/database/create-fluxdb.sql once using a MySQL administrator.
# You can override these values with DB_URL, DB_USERNAME and DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fluxdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:flux_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

logging.level.org.springframework.web=INFO

# Phone OTP verification. Keep disabled until MSG91 credentials/template are configured.
auth.otp.enabled=${OTP_ENABLED:false}
auth.otp.msg91.auth-key=${MSG91_AUTH_KEY:}
auth.otp.msg91.template-id=${MSG91_TEMPLATE_ID:}
auth.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
auth.otp.resend-seconds=${OTP_RESEND_SECONDS:30}
