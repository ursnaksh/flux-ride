server.port=${PORT:8080}

# Run backend/database/create-fluxdb.sql once using a MySQL administrator.
# You can override these values with DB_URL, DB_USERNAME and DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fluxdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:flux_app}
spring.datasource.password=${DB_PASSWORD}

# Do not kill the whole service when the remote DB/DNS is temporarily unavailable.
# Hikari starts immediately and keeps retrying in the background.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:3}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

logging.level.org.springframework.web=INFO

# Phone OTP verification. Firebase is the preferred provider for the web app.
auth.otp.enabled=${OTP_ENABLED:false}
auth.otp.provider=${OTP_PROVIDER:firebase}
auth.otp.firebase.api-key=${FIREBASE_API_KEY:}
auth.otp.msg91.auth-key=${MSG91_AUTH_KEY:}
auth.otp.msg91.template-id=${MSG91_TEMPLATE_ID:}
auth.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
auth.otp.resend-seconds=${OTP_RESEND_SECONDS:30}
auth.otp.demo.expose-code=${OTP_DEMO_EXPOSE_CODE:false}
auth.otp.demo.secret=${OTP_DEMO_SECRET:${DB_PASSWORD:flux-demo-otp-secret}}

# Signed authentication sessions.
auth.jwt.secret=${JWT_SECRET:${DB_PASSWORD:dev-only-change-this-secret-before-production-123456}}
auth.jwt.ttl-hours=${JWT_TTL_HOURS:168}

# Student email verification.
student.verification.enabled=${STUDENT_VERIFICATION_ENABLED:true}
student.verification.domain=${STUDENT_EMAIL_DOMAIN:vit.edu}
student.verification.code-secret=${EMAIL_CODE_SECRET:${DB_PASSWORD:dev-email-code-secret-change-this-before-production}}
student.verification.expiry-minutes=${STUDENT_EMAIL_EXPIRY_MINUTES:10}
student.verification.resend-seconds=${STUDENT_EMAIL_RESEND_SECONDS:60}

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
student.verification.from=${STUDENT_EMAIL_FROM:}
